name: BiS legacy evidence monitor (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - run: python3 -m unittest discover -s scripts/tests -p 'test_bis_auto_sync.py' -v
      - name: Read-only legacy comparison (never publishes an addon)
        run: python3 scripts/bis_auto_sync.py --root .
