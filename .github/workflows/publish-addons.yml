name: Publish GPT custom addons

on:
  push:
    branches: [main]
    paths:
      - 'addons/*.zip'
      - 'scripts/build_catalog.py'
      - 'scripts/build_quest_phase3.py'
      - 'scripts/phase3_quest_v2.5.0.patch.gz.b64'
      - 'scripts/build_quest_phase4.py'
      - 'scripts/phase4_quest_v2.6.0.patch.gz.b64'
      - 'scripts/build_quest_phase5.py'
      - 'scripts/phase5_quest_v2.7.0.patch.gz.b64'
      - 'scripts/build_quest_eui_hotfix.py'
      - 'scripts/hotfix_quest_v2.7.1.patch.gz.b64'
      - 'scripts/build_quest_catchup.py'
      - 'scripts/phase8_quest_v2.8.0.patch.gz.b64'
      - 'scripts/build_quest_eui_position_fix.py'
      - 'scripts/eui_position_fix_v2.8.1.patch.gz.b64'
      - 'scripts/build_quest_v282.py'
      - 'scripts/quest_v2.8.2.patch.gz.b64'
      - 'scripts/build_quest_v290.py'
      - 'scripts/quest_v2.9.0_delta.gz.b64'
      - 'scripts/build_quest_v291.py'
      - 'scripts/quest_v2.9.1_delta.gz.b64'
      - 'scripts/build_quest_v292.py'
      - 'scripts/build_quest_v293.py'
      - 'scripts/build_quest_v294.py'
      - 'scripts/build_quest_v295.py'
      - 'scripts/build_quest_v296.py'
      - 'scripts/build_quest_v297.py'
      - 'scripts/build_quest_v298.py'
      - 'scripts/build_quest_v299.py'
      - 'scripts/quest_v2.9.9_delta.gz.b64'
      - 'scripts/quest_v2.9.8_delta.gz.b64'
      - 'scripts/quest_v2.9.7_delta.gz.b64'
      - 'scripts/quest_v2.9.6_delta.gz.b64'
      - 'scripts/quest_v2.9.5_delta.gz.b64'
      - 'scripts/build_bis_v090.py'
      - 'scripts/bis090/**'
      - 'scripts/build_party_in_raid.py'
      - 'scripts/party_in_raid/**'
      - 'scripts/party_in_raid/tests/test_party.py'
      - 'retired_addons.json'
      - '.github/workflows/publish-addons.yml'
  workflow_dispatch:

# Only the repository owner can push to main/dispatch; never run this with untrusted PR content.
permissions:
  contents: write

concurrency:
  group: forever-addon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, release, and promote custom addon catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out public distribution repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ensure public anonymous downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$GH_REPO" --json visibility --jq .visibility)"
          test "$visibility" = PUBLIC || { echo 'Public GitHub repository is required.' >&2; exit 1; }
      - name: Reconstruct reviewed Quest Guide V2.9.9 compact starter tags
        run: |
          set -euo pipefail
          if ! test -f addons/ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip; then
            if ! test -f addons/ForeverQuestGuide_Forever_v2.9.8_StartItem_SourceRoutes.zip; then
              curl --fail --location --retry 3 --max-time 120 \
                'https://github.com/howonses-cyber/forever-custom-addons/releases/download/addons-r100073-run46148826358-try1/ForeverQuestGuide_Forever_v2.9.8_StartItem_SourceRoutes.zip' \
                -o addons/ForeverQuestGuide_Forever_v2.9.8_StartItem_SourceRoutes.zip
            fi
            python3 scripts/build_quest_v299.py --expected-sha 89a6e98ae6ea1c8814b0ef61d969311989f58732ece421429f260085029a75e4
          fi
          echo '89a6e98ae6ea1c8814b0ef61d969311989f58732ece421429f260085029a75e4  addons/ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip' | sha256sum -c -
          rm -f addons/ForeverQuestGuide_Forever_v2.9.8_StartItem_SourceRoutes.zip

      - name: Verify Quest Guide with native Lua 5.1 and LuaJIT mock suites
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run native language and quest guide regressions
        run: |
          set -euo pipefail
          python -m pip install 'lupa==2.8'
          mkdir -p verify_build
          unzip -q addons/ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip -d verify_build
          python verify_build/ForeverDungeonQuestGuide/tests/fetch_native_chat_fixture.py --destination verify_build/native_chat
          python verify_build/ForeverDungeonQuestGuide/tests/run_compatibility.py \
            --addon-root verify_build/ForeverDungeonQuestGuide \
            --chat-fixtures verify_build/native_chat \
            --report verify_build/regression.json

      - name: Rebuild and verify Forever Party in Raid V1.1.0 native EUI frames
        run: |
          set -euo pipefail
          python3 scripts/build_party_in_raid.py --expected-sha 3046e8dc20264604b594b06ba1cb90b9ce771122204baddc95be5ad20d41451a
          python3 scripts/party_in_raid/tests/test_party.py \
            --addon-root scripts/party_in_raid/ForeverPartyInRaid

      - name: Build and verify Forever BiS V0.9.0
        run: |
          set -euo pipefail
          python3 scripts/build_bis_v090.py
      - name: Preserve verified BiS package as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForeverBiSAudit-v0.9.0-verified
          path: addons/ForeverBiSAudit_Forever_v0.9.0_GuideRanks_KoreanAcquisition.zip
          if-no-files-found: error
          retention-days: 30

      - name: Validate every ZIP and generate a release
        env:
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 scripts/build_catalog.py --root . --repo "$REPO" \
            --revision "$((100000 + RUN_NUMBER))" --tag auto --out dist
          python3 -m json.tool dist/catalog.json >/dev/null
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -ge 1
      - name: Create draft, verify uploaded assets, publish latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json;print(json.load(open("dist/release_info.json"))["tag"])')"
          gh release create "$tag" dist/catalog.json dist/*.zip \
            --repo "$GH_REPO" --draft --latest=false \
            --title "Forever Custom Addons $tag" \
            --notes 'Owner-published GPT-made custom addons only. No official addons and no WTF data.'
          mkdir -p verify
          gh release download "$tag" --repo "$GH_REPO" --pattern 'catalog.json' --dir verify
          cmp dist/catalog.json verify/catalog.json
          gh release download "$tag" --repo "$GH_REPO" --pattern 'ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip' --dir verify
          cmp dist/ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip verify/ForeverQuestGuide_Forever_v2.9.9_CompactStartTypes.zip
          gh release download "$tag" --repo "$GH_REPO" --pattern 'ForeverBiSAudit_Forever_v0.9.0_GuideRanks_KoreanAcquisition.zip' --dir verify
          cmp dist/ForeverBiSAudit_Forever_v0.9.0_GuideRanks_KoreanAcquisition.zip verify/ForeverBiSAudit_Forever_v0.9.0_GuideRanks_KoreanAcquisition.zip
          gh release edit "$tag" --repo "$GH_REPO" --draft=false --latest
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 \
            "https://github.com/$GH_REPO/releases/latest/download/catalog.json" \
            -o verify/catalog_public.json
          cmp dist/catalog.json verify/catalog_public.json
      - name: Record new baseline for subsequent versions
        run: |
          set -euo pipefail
          cp dist/catalog.json catalog.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json addons/
          git commit -m 'chore: record published custom addon catalog [skip ci]'
          git push origin HEAD:main